<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover is what turns on env(safe-area-inset-*) in CSS —
         without it iOS clips the HUD behind the notch / home indicator on
         iPhone X and newer. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Force browser to revalidate index.html on every load so users
         always pick up the latest hashed-bundle reference. Without
         this, mobile Safari especially can cache index.html for
         hours, leaving users on a stale build that points to a
         since-replaced bundle. Caught 2026-05-16 when QA testers
         were missing fixes that had shipped hours earlier. The
         hashed bundle files themselves stay cacheable forever
         (their hash changes when content changes). -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- iOS standalone (add to Home Screen) + notch tint. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a0a30">
    <title>Vulcan Runner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; }
        /* Kill iOS Safari's text-size inflation on rotate / tap (default
           200% zoom breaks our precise HUD). */
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        /* Kill blue tap highlight + double-tap-to-zoom site-wide. Canvas
           overrides touch-action below because the input layer handles
           swipes directly via pointer events. */
        * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        #ui { position: fixed; inset: 0; pointer-events: none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji'; color: #fff; z-index: 10; }
        #ui > * { pointer-events: auto; }
    </style>
  <script type="module" crossorigin src="./assets/main-CIkGXf5S.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/preload-helper-CiFt1x5u.js">
  <link rel="modulepreload" crossorigin href="./assets/GLTFLoader-QIwOK3nA.js">
</head>
<body>
    <div id="ui"></div>
</body>
</html>
