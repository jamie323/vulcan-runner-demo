name: Deploy to AWS mirror

# Fires every time gh-pages is updated, plus a manual "Run workflow" button
# in the Actions tab so you can force a redeploy without pushing a commit.
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

# Only one deploy runs at a time — prevents races if two pushes land close
# together. The newer one wins; the older one gets cancelled.
concurrency:
  group: aws-mirror
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH into runner.vulcanforged.com and pull latest
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_DEPLOY_KEY }}
          port: ${{ secrets.AWS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.AWS_RUNNER_PATH }}"
            git fetch --quiet origin gh-pages
            git reset --hard origin/gh-pages
            echo "✔ runner.vulcanforged.com now at $(git rev-parse --short HEAD) ($(date -u +%H:%M:%SZ))"
