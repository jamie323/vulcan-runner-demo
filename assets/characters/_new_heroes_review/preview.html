<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>New Heroes — Run Cycle Preview</title>
<style>
  body{margin:0;background:#0f0820;color:#ffe7a3;font-family:'Cinzel',Georgia,serif;}
  h1{text-align:center;padding:16px;margin:0;letter-spacing:3px;font-size:22px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px;}
  .cell{background:#1a0f25;border:1px solid #c9a24e;border-radius:10px;overflow:hidden;position:relative;height:46vh;}
  .cell .label{position:absolute;top:8px;left:10px;z-index:2;font-size:15px;letter-spacing:2px;text-shadow:0 2px 6px #000;}
  canvas{display:block;width:100%;height:100%;}
  .note{text-align:center;font-size:12px;opacity:.6;padding:6px;}
</style>
</head>
<body>
<h1>⚡ NEW HEROES — RUN CYCLE PREVIEW ⚡</h1>
<div class="grid" id="grid"></div>
<div class="note">Each panel auto-plays the RunFast loop. Drag to orbit. Generated via Meshy API · {hermes, spartan, atalanta, apollo}_run.glb</div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const HEROES = ['hermes','spartan','atalanta','apollo'];
const grid = document.getElementById('grid');
const loader = new GLTFLoader();

HEROES.forEach(name=>{
  const cell=document.createElement('div'); cell.className='cell';
  const lab=document.createElement('div'); lab.className='label'; lab.textContent=name.toUpperCase();
  cell.appendChild(lab); grid.appendChild(cell);

  const scene=new THREE.Scene(); scene.background=new THREE.Color(0x140a22);
  const cam=new THREE.PerspectiveCamera(40, cell.clientWidth/cell.clientHeight, 0.1, 100);
  cam.position.set(0,1.1,3.4);
  const r=new THREE.WebGLRenderer({antialias:true}); r.setSize(cell.clientWidth, cell.clientHeight);
  r.setPixelRatio(Math.min(devicePixelRatio,2)); cell.appendChild(r.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff,0x443355,1.4));
  const key=new THREE.DirectionalLight(0xffffff,1.6); key.position.set(2,4,3); scene.add(key);
  const ctrl=new OrbitControls(cam,r.domElement); ctrl.target.set(0,1,0); ctrl.update();

  let mixer=null; const clock=new THREE.Clock();
  loader.load(`${name}_run.glb`, g=>{
    const m=g.scene; scene.add(m);
    const box=new THREE.Box3().setFromObject(m); const h=box.max.y-box.min.y||2;
    m.scale.setScalar(2/h); const b2=new THREE.Box3().setFromObject(m); m.position.y=-b2.min.y;
    m.rotation.y=Math.PI; // BACK VIEW — facing away, like the gameplay camera
    if(g.animations?.length){ mixer=new THREE.AnimationMixer(m); mixer.clipAction(g.animations[0]).play(); }
  }, undefined, e=>{ lab.textContent=name.toUpperCase()+' (load error)'; });

  (function loop(){ requestAnimationFrame(loop); if(mixer)mixer.update(clock.getDelta()); r.render(scene,cam); })();
});
</script>
</body>
</html>
